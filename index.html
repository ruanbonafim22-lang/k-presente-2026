<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>Para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   NOSSO CÉU DE DEZEMBRO — direção de arte
   Noite profunda + dourado champagne + um toque de vinho.
   ===================================================================== */
:root{
  --bg0:#04060d;--bg1:#080e20;--bg2:#101b3b;
  --ink:#f4eee2;--mut:#b2b4c8;--gold:#d9bb7b;--gold2:#f3dfae;--wine:#8a2b44;
  --line:rgba(217,187,123,.28);
  --ease:cubic-bezier(.2,.8,.2,1);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg0);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,#0d1636 0%,#070b1a 55%,#03050b 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:90}
.grain{position:fixed;inset:-50%;z-index:80;pointer-events:none;opacity:.075;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media(prefers-reduced-motion:no-preference){.grain{animation:grain 1.2s steps(6) infinite}}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,3%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}

/* ---------- tipografia utilitária ---------- */
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:500}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,7.5vw,3.6rem);line-height:1.04;letter-spacing:-.01em}
.h2 em{font-style:italic;color:var(--gold2)}
.lead{font-size:1rem;line-height:1.75;color:var(--mut);max-width:34rem}
.serif{font-family:var(--serif)}
.rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:52px;padding:0 30px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--gold2);background:rgba(16,27,59,.35);backdrop-filter:blur(6px);transition:transform .5s var(--ease),background .4s,border-color .4s,box-shadow .5s}
.btn:hover{border-color:var(--gold);background:rgba(217,187,123,.12);box-shadow:0 0 36px rgba(217,187,123,.18)}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#f3dfae,#cfa75d);color:#1a1206;border-color:transparent;font-weight:600}
.btn.gold:hover{box-shadow:0 0 44px rgba(243,223,174,.45);background:linear-gradient(135deg,#fff0c8,#d9bb7b)}
.btn[disabled]{opacity:.4;pointer-events:none}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}

/* ---------- palco e páginas ---------- */
#app{position:fixed;inset:0;z-index:10;opacity:0;transition:opacity 1.2s ease}
#app.on{opacity:1}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(78px + env(safe-area-inset-top)) 22px calc(112px + env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(var(--enter,40px),0,0) scale(.985);filter:blur(8px);
  transition:opacity .7s ease,transform .9s var(--ease),filter .7s ease,visibility 0s linear .9s;scrollbar-width:thin;scrollbar-color:rgba(217,187,123,.3) transparent}
.page.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:opacity .9s ease .12s,transform 1.1s var(--ease) .08s,filter .9s ease .08s,visibility 0s}
.wrap{max-width:1020px;margin:0 auto}
.head{margin-bottom:34px}
.head .h2{margin-top:12px}
.head .lead{margin-top:14px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1.1s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}

/* ---------- barras ---------- */
#topbar{position:fixed;z-index:40;top:0;left:0;right:0;background:linear-gradient(180deg,rgba(4,6,13,.9),transparent);display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;opacity:0;pointer-events:none;transition:opacity 1s}
#topbar.on{opacity:1}
#topbar>*{pointer-events:auto}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(8,14,32,.55);backdrop-filter:blur(10px);transition:.4s var(--ease)}
.ib:hover{border-color:var(--gold);transform:scale(1.06)}
.ib svg{width:20px;height:20px;stroke:var(--gold2);fill:none;stroke-width:1.5;stroke-linecap:round}
.brand{font-family:var(--script);font-size:1.7rem;color:var(--gold2);line-height:1;text-shadow:0 0 22px rgba(243,223,174,.35)}
#snd.playing svg .wave{animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{opacity:.3}}
#bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .8s;background:linear-gradient(0deg,rgba(4,6,13,.92),transparent)}
#bottom.on{opacity:1}
#bottom.on>*{pointer-events:auto}
#bottom.hide{opacity:0!important}
#bottom.hide>*{pointer-events:none!important}
.mid{flex:1;min-width:0;text-align:center}
.plabel{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:2px;background:rgba(255,255,255,.1);margin-top:9px;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1s var(--ease)}
.nb.glow{border-color:var(--gold2);box-shadow:0 0 30px rgba(243,223,174,.4);animation:pulse 2.2s ease-in-out infinite}
.nb[disabled]{opacity:.35}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(243,223,174,.15)}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:60;background:rgba(4,6,13,.94);backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center;padding:80px 28px 40px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s;overflow-y:auto}
#menu.open{opacity:1;visibility:visible;transition:opacity .5s}
#menu ol{list-style:none;margin:0 auto;padding:0;max-width:520px;width:100%}
#menu li{border-bottom:1px solid rgba(217,187,123,.14);opacity:0;transform:translateX(-14px);transition:.7s var(--ease);transition-delay:calc(var(--i)*45ms)}
#menu.open li{opacity:1;transform:none}
#menu li button{width:100%;display:flex;align-items:baseline;gap:18px;padding:13px 0;text-align:left;transition:.4s}
#menu li button:hover{padding-left:10px;color:var(--gold2)}
#menu .n{font-size:.7rem;letter-spacing:.2em;color:var(--gold);width:26px}
#menu .t{font-family:var(--serif);font-size:1.55rem;flex:1}
#menu .s{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
#menu li.cur .t{color:var(--gold2);font-style:italic}
#menu li.lock .t{opacity:.45}
#menu li.finale .t{color:var(--gold2)}
#menu li.finale:not(.lock) .s{color:var(--gold2)}
#menuClose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}

/* ---------- portão ---------- */
#gate{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:28px;background:radial-gradient(90% 70% at 50% 40%,#0f1a40 0%,#060a18 60%,#02030a 100%);transition:opacity 1.3s ease,transform 1.6s var(--ease),filter 1.3s}
#gate.open{opacity:0;transform:scale(1.25);filter:blur(10px);pointer-events:none}
#gate canvas{position:absolute;inset:0;width:100%;height:100%}
.gate-in{position:relative;max-width:440px;width:100%;text-align:center}
.gate-in .moon{width:64px;height:64px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6dc,#d9bb7b 60%,#8a6a2d);box-shadow:0 0 60px rgba(243,223,174,.45),0 0 140px rgba(243,223,174,.18);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.gate-in h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.12;margin:14px 0 8px}
.gate-in h1 em{color:var(--gold2)}
.gate-in .sub{color:var(--mut);font-size:.92rem;line-height:1.6}
#gateForm{margin-top:32px;display:flex;flex-direction:column;gap:16px;align-items:center}
#gateInput{width:100%;max-width:300px;text-align:center;font-family:var(--serif);font-size:2rem;letter-spacing:.14em;color:var(--gold2);background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;outline:none;transition:border-color .4s}
#gateInput::placeholder{color:rgba(243,223,174,.25)}
#gateInput:focus{border-color:var(--gold2)}
#gateMsg{min-height:3.2em;font-size:.9rem;line-height:1.55;color:var(--gold2);font-style:italic;font-family:var(--serif);font-size:1.15rem}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#portal{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;z-index:75;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff8e2 0%,rgba(243,223,174,.9) 30%,rgba(217,187,123,0) 70%)}
#portal.go{animation:portal 1.8s var(--ease) forwards}
@keyframes portal{0%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(160)}}

/* ---------- capa ---------- */
.cover{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.pair{width:150px;height:60px;margin-bottom:18px}
.pair path{stroke:var(--gold2);stroke-width:1;fill:none;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round}
.page.active .pair path{animation:draw 2.6s var(--ease) .5s forwards}
.pair circle{fill:var(--gold2);filter:drop-shadow(0 0 8px #f3dfae);opacity:0}
.page.active .pair circle{animation:fadein 1.2s ease forwards 1.4s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.ctitle .w{display:block}
.ctitle{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,15vw,7rem);line-height:.95;letter-spacing:-.02em;margin:10px 0 4px}
.ctitle span{display:inline-block;opacity:0;transform:translateY(40px) rotate(3deg);filter:blur(10px)}
.page.active .ctitle span{animation:letter 1.4s var(--ease) forwards;animation-delay:calc(.5s + var(--i)*.09s)}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.ctitle em{font-style:italic;color:var(--gold2)}
.csub{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,4.4vw,1.6rem);color:var(--mut);max-width:28rem;line-height:1.4;margin:6px 0 30px}
.cdates{margin-top:26px;font-size:.7rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.scrollhint{position:absolute}

/* ---------- linha do tempo ---------- */
.tl{position:relative;padding-left:34px}
.tl::before,.tl .fill{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .fill{background:linear-gradient(var(--gold2),var(--gold));height:var(--p,0%);bottom:auto;box-shadow:0 0 12px var(--gold)}
.tli{position:relative;margin-bottom:46px;cursor:pointer}
.tli::before{content:"";position:absolute;left:-31px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--bg0);border:1px solid var(--gold);box-shadow:0 0 0 5px rgba(217,187,123,.08);transition:.6s}
.tli.in::before{background:var(--gold2);box-shadow:0 0 0 6px rgba(217,187,123,.14),0 0 22px var(--gold)}
.tli .ph{aspect-ratio:4/3;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;position:relative}
.tli .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.tli:hover .ph img{transform:scale(1.05)}
.tli .date{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.tli h3{font-family:var(--serif);font-weight:400;font-size:1.85rem;margin:6px 0 8px;line-height:1.1}
.tli p{color:var(--mut);line-height:1.75;font-size:.98rem}
@media(min-width:820px){
  .tl{padding-left:0}
  .tl::before,.tl .fill{left:50%}
  .tli{width:50%;padding-right:54px;margin-bottom:70px}
  .tli:nth-child(even){margin-left:50%;padding-right:0;padding-left:54px}
  .tli::before{left:auto;right:-6px}
  .tli:nth-child(even)::before{right:auto;left:-6px}
  .tli:nth-child(odd){text-align:right}
}

/* ---------- galeria ---------- */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.pol{grid-column:span 3;background:#f6efe1;padding:8px 8px 34px;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(var(--r,0deg));transition:transform .7s var(--ease),box-shadow .7s;cursor:zoom-in;position:relative}
.pol:hover{transform:rotate(0) scale(1.04);z-index:2;box-shadow:0 26px 60px rgba(0,0,0,.6)}
.pol img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#222}
.pol.wide img{aspect-ratio:4/3}
.pol span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--script);color:#3a2d1b;font-size:1.25rem;line-height:1}
.pol.wide{grid-column:span 6}
@media(min-width:820px){.pol{grid-column:span 2}.pol.wide{grid-column:span 4}.pol:nth-child(3n+2){margin-top:34px}}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:65;background:rgba(3,5,11,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:70px 18px 28px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#lb.open{opacity:1;visibility:visible;transition:opacity .5s}
#lb img{max-height:68dvh;max-width:100%;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.7);transition:opacity .4s}
#lbCap{font-family:var(--serif);font-style:italic;font-size:1.4rem;text-align:center;color:var(--gold2);max-width:32rem;line-height:1.35}
#lbSub{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);text-align:center}
.lbn{position:absolute;top:50%;margin-top:-23px}
#lbPrev{left:12px}#lbNext{right:12px}
#lbClose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}

/* ---------- contador ---------- */
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:700px){.count{grid-template-columns:repeat(6,1fr)}}
.unit{border:1px solid var(--line);border-radius:14px;padding:22px 6px 16px;text-align:center;background:linear-gradient(160deg,rgba(16,27,59,.7),rgba(8,14,32,.4));overflow:hidden;position:relative}
.unit::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.35)}
.num{display:block;font-family:var(--serif);font-size:clamp(2.6rem,10vw,3.8rem);line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(243,223,174,.25)}
.num.tick{animation:tick .6s var(--ease)}
@keyframes tick{0%{transform:translateY(-55%);opacity:0;filter:blur(4px)}100%{transform:none;opacity:1;filter:none}}
.lbl{display:block;margin-top:10px;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}
.cnote{margin-top:34px;display:grid;gap:12px}
.cnote div{border-left:1px solid var(--gold);padding:4px 0 4px 18px;color:var(--mut);font-size:.98rem;line-height:1.6}
.cnote b{font-family:var(--serif);font-weight:500;font-size:1.5rem;color:var(--gold2)}

/* ---------- mapa das estrelas ---------- */
.sky{display:flex;flex-direction:column;align-items:center;gap:16px}
.poster{width:100%;max-width:560px;text-align:center}
.poster .ttl{font-family:var(--serif);font-size:clamp(1.9rem,7vw,2.8rem);letter-spacing:.34em;text-transform:uppercase;font-weight:300;margin-bottom:6px}
#skysvg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;filter:drop-shadow(0 0 40px rgba(60,90,200,.18))}
.skyfoot .names{font-family:var(--script);font-size:clamp(2.2rem,9vw,3.4rem);color:var(--gold2);line-height:1.1;margin-top:6px}
.skyfoot .dt{letter-spacing:.42em;font-size:.8rem;text-transform:uppercase;margin-top:8px}
.skyfoot .loc{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-top:8px}
#skyCap{min-height:112px;width:100%;max-width:520px;text-align:center;border-top:1px solid var(--line);padding-top:16px}
#skyCap b{display:block;font-family:var(--serif);font-weight:500;font-size:1.7rem;color:var(--gold2)}
#skyCap p{font-family:var(--serif);font-style:italic;font-size:1.2rem;line-height:1.45;margin-top:6px;color:var(--ink)}
#skyCap small{display:block;margin-top:10px;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.const line{stroke:var(--gold2);stroke-width:.9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.85;transition:stroke-dashoffset 1.8s var(--ease)}
.const.on line{stroke-dashoffset:0;filter:drop-shadow(0 0 3px rgba(243,223,174,.8))}
.const .lab{font-family:var(--sans);font-size:9px;letter-spacing:.14em;fill:var(--gold2);opacity:0;transition:opacity 1.4s .6s;text-transform:uppercase}
.const.on .lab{opacity:.85}
.const .cn{font-family:var(--serif);font-style:italic;font-size:15px;fill:var(--gold2);opacity:0;transition:opacity 1.4s .4s}
.const.on .cn{opacity:.9}
.st{fill:#fff;transition:r .5s,fill .5s,filter .5s}
.const.on .st{fill:var(--gold2);filter:drop-shadow(0 0 4px #f3dfae)}
.fs{fill:#fff;transform-box:fill-box;transform-origin:center;transition:transform .5s var(--ease),fill .5s}
.fs.near{transform:scale(2.2);fill:var(--gold2)}
@media(prefers-reduced-motion:no-preference){.fs.tw{animation:tw var(--t,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}}
@keyframes tw{50%{opacity:.25}}
.halo{fill:none;stroke:var(--gold2);stroke-width:.6;opacity:0;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:no-preference){.halo{animation:halo 3s ease-out infinite}}
.const.on .halo{display:none}
@keyframes halo{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.skybtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.sm{min-height:42px;padding:0 20px;font-size:.68rem}

/* ---------- motivos ---------- */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;perspective:1200px}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}}
.fl{aspect-ratio:3/4.2;position:relative;transform-style:preserve-3d;transition:transform 1s var(--ease);width:100%;text-align:left}
.fl.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.face.f{background:linear-gradient(160deg,#14224a,#0a1128);overflow:hidden}
.face.f::before{content:"";position:absolute;inset:8px;border:1px solid rgba(217,187,123,.18);border-radius:9px}
.face.f .no{font-family:var(--serif);font-size:3.4rem;color:var(--gold2);font-weight:300;line-height:1}
.face.f .tt{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.2}
.face.f .tap{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.face.b{transform:rotateY(180deg);background:linear-gradient(160deg,#3a1624,#1b0c18);justify-content:center}
.face.b p{font-family:var(--serif);font-size:1.12rem;line-height:1.45;color:var(--ink)}
.face.b::after{content:"✦";position:absolute;bottom:14px;right:16px;color:var(--gold);font-size:.9rem}

/* ---------- cartas ---------- */
.env{display:flex;flex-direction:column;gap:14px}
.envl{position:relative;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;padding:26px 22px 22px;background:linear-gradient(160deg,rgba(24,36,76,.7),rgba(10,17,40,.6));overflow:hidden;transition:.6s var(--ease)}

.envl::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(170deg,rgba(255,255,255,.05),transparent);clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:absolute;right:20px;top:20px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8405c,#6a1a2e);box-shadow:0 4px 14px rgba(0,0,0,.5);display:grid;place-items:center;color:#f3c9d1;font-size:.8rem}
.envl .k{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.envl h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin-top:8px;padding-right:46px;line-height:1.1}
.envl .rd{font-size:.7rem;color:var(--mut);margin-top:10px;letter-spacing:.14em;text-transform:uppercase}
#lt{position:fixed;inset:0;z-index:66;background:rgba(3,5,11,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:70px 14px 24px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#lt.open{opacity:1;visibility:visible;transition:opacity .5s}
.paper{position:relative;max-width:560px;width:100%;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#f7f0e0,#efe4cc);color:#33281a;border-radius:4px;padding:38px 28px 34px;box-shadow:0 40px 90px rgba(0,0,0,.65);transform:translateY(40px) rotate(-1.2deg);transition:transform 1s var(--ease)}
#lt.open .paper{transform:none}
.paper h3{font-family:var(--serif);font-size:1.9rem;font-weight:500;margin-bottom:16px;line-height:1.1}
.paper .body{font-family:var(--serif);font-size:1.28rem;line-height:1.6}
.paper .body p{margin-bottom:14px}
.paper .sig{font-family:var(--script);font-size:2rem;margin-top:10px;opacity:0;transition:opacity 1.2s}
.paper .sig.show{opacity:1}
.caret::after{content:"|";margin-left:1px;animation:blink 1s steps(2) infinite;color:#8a2b44}
@keyframes blink{50%{opacity:0}}
#ltClose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}

/* ---------- sonhos ---------- */
.dreams{display:flex;flex-direction:column;gap:14px}
.dream{border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,rgba(20,34,74,.65),rgba(8,14,32,.55));overflow:hidden;transition:border-color .6s,box-shadow .8s}
.dream.open{border-color:var(--gold);box-shadow:0 0 50px rgba(217,187,123,.12)}
.dh{width:100%;display:flex;align-items:center;gap:18px;padding:18px 18px;text-align:left;min-height:88px}
.ico{width:64px;height:64px;flex:none;color:var(--gold2);display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(217,187,123,.06);transition:.8s var(--ease)}
.ico svg{width:38px;height:38px}
.dream.open .ico{transform:rotate(360deg) scale(1.08);background:rgba(217,187,123,.16)}
.dt1{flex:1;min-width:0}
.dt1 .k{font-size:.62rem;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
.dt1 h3{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.05;margin-top:4px}
.chev{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.5;transition:transform .6s var(--ease)}
.dream.open .chev{transform:rotate(180deg)}
.db{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s var(--ease)}
.dream.open .db{grid-template-rows:1fr}
.db>div{overflow:hidden}
.db .in{padding:0 20px 22px}
.db p.fr{font-family:var(--serif);font-style:italic;font-size:1.3rem;line-height:1.45;color:var(--ink)}
.done .dt1 h3{text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2);font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;background:rgba(217,187,123,.1)}
.dream.done .ico{border-color:var(--gold2);box-shadow:0 0 30px rgba(243,223,174,.3)}
.dream.done .ico::after{content:"✓";position:absolute;margin:44px -44px 0 0;width:22px;height:22px;border-radius:50%;background:var(--gold2);color:#1a1206;font-size:.75rem;display:grid;place-items:center;font-weight:700}
.dnew{border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut);font-family:var(--serif);font-style:italic;font-size:1.15rem}
.globebox{margin-top:18px}
#gl{width:100%;max-width:380px;aspect-ratio:1;display:block;margin:0 auto;touch-action:none;cursor:grab}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:.4s}
.chip:hover,.chip.on{border-color:var(--gold2);color:var(--gold2);background:rgba(217,187,123,.1)}

/* ---------- trilha ---------- */
.player{display:flex;flex-direction:column;align-items:center;gap:22px}
.disc{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle at 50% 50%,#10162d 0 2px,#0a0f22 2px 4px);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 60px rgba(0,0,0,.6);display:grid;place-items:center}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent,rgba(243,223,174,.12),transparent 30%,transparent 55%,rgba(243,223,174,.1),transparent 80%)}
.disc i{width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8405c,#6a1a2e);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(0,0,0,.4)}
.disc i::after{content:"";width:9%;aspect-ratio:1;background:var(--bg0);border-radius:50%;width:12px;height:12px}
.disc.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tinfo{text-align:center}
.tinfo b{display:block;font-family:var(--serif);font-weight:400;font-size:1.8rem}
.tinfo span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.ctrl{display:flex;align-items:center;gap:18px}
.play{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#f3dfae,#cfa75d);display:grid;place-items:center;transition:.4s var(--ease);box-shadow:0 0 40px rgba(243,223,174,.3)}
.play:active{transform:scale(.94)}
.play svg{width:26px;height:26px;fill:#1a1206}
.tprog{width:100%;max-width:360px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;cursor:pointer}
.tprog i{display:block;height:100%;width:0;background:var(--gold2)}
.tlist{width:100%;max-width:520px;display:flex;flex-direction:column}
.tlist button{display:flex;gap:16px;align-items:baseline;text-align:left;padding:14px 4px;border-bottom:1px solid rgba(217,187,123,.14);transition:.4s}
.tlist button:hover,.tlist button.on{color:var(--gold2);padding-left:10px}
.tlist .n{font-size:.7rem;color:var(--gold);letter-spacing:.2em}
.tlist .t{font-family:var(--serif);font-size:1.35rem;flex:1}
.tlist .a{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.pnote{max-width:30rem;text-align:center;color:var(--mut);font-size:.9rem;line-height:1.6;font-style:italic;font-family:var(--serif);font-size:1.1rem}

/* ---------- quiz ---------- */
.qbox{max-width:620px;margin:0 auto}
.qprog{display:flex;gap:6px;margin-bottom:26px}
.qprog i{flex:1;height:2px;background:rgba(255,255,255,.12);border-radius:2px;transition:.6s}
.qprog i.d{background:var(--gold)}
.qq{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,6.4vw,2.6rem);line-height:1.12;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:58px;text-align:left;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(16,27,59,.4);font-size:1rem;line-height:1.4;transition:.4s var(--ease);display:flex;align-items:center;gap:14px}
.opt b{font-family:var(--serif);color:var(--gold);font-weight:500;font-size:1.2rem}
.opt:hover{border-color:var(--gold);transform:translateX(4px)}
.opt.ok{border-color:#8fcf9d;background:rgba(80,160,100,.16)}
.opt.no{border-color:var(--wine);background:rgba(138,43,68,.22)}
.qfb{min-height:3.4em;margin:18px 0 6px;font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--gold2);line-height:1.4}
.qres{text-align:center}
.qres .big{font-family:var(--serif);font-size:clamp(4rem,20vw,7rem);line-height:1;color:var(--gold2);font-weight:300}
.qres h3{font-family:var(--serif);font-weight:400;font-size:2rem;margin:10px 0}

/* ---------- caça ao tesouro ---------- */
.hunt{--paper:#e9dcc0;position:relative}
.hunt-bg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:0;
  background:radial-gradient(80% 60% at 50% 20%,rgba(217,187,123,.1),transparent 70%),repeating-linear-gradient(0deg,transparent 0 46px,rgba(217,187,123,.04) 46px 47px),repeating-linear-gradient(90deg,transparent 0 46px,rgba(217,187,123,.04) 46px 47px)}
.page.active .hunt-bg{opacity:1}
.hunt .wrap{position:relative;z-index:1}
.stamp-tag{display:inline-block;border:1px solid var(--gold);color:var(--gold2);padding:5px 12px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;transform:rotate(-2deg);background:rgba(217,187,123,.08)}
.hprog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 24px;flex-wrap:wrap}
.hprog .lab{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.hchips{display:flex;gap:8px;align-items:center}
.hchip{width:38px;height:38px;border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:1.1rem;color:var(--mut);transition:.5s}
.hchip.s{border-style:solid;border-color:var(--gold2);color:#1a1206;background:var(--gold2)}
.hchip.c{border-style:solid;border-color:var(--gold2);color:var(--gold2);box-shadow:0 0 22px rgba(243,223,174,.4)}
.hchip[disabled]{opacity:.45;pointer-events:none}
.dossier{position:relative;border:1px solid var(--line);border-radius:6px;padding:30px 24px 28px;background:linear-gradient(170deg,rgba(26,36,74,.8),rgba(12,18,42,.85));box-shadow:0 30px 70px rgba(0,0,0,.5)}
.dossier::before{content:"";position:absolute;inset:7px;border:1px solid rgba(217,187,123,.18);pointer-events:none;border-radius:3px}
.dossier .no{font-family:var(--serif);font-size:4.4rem;line-height:.8;color:rgba(243,223,174,.18);position:absolute;right:20px;top:18px;font-weight:300}
.dossier .tp{font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.dossier h3{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,6.6vw,2.7rem);line-height:1.08;margin:8px 0 18px;padding-right:56px}
.dossier .tx p{font-family:var(--serif);font-size:1.28rem;line-height:1.55;margin-bottom:12px}
.dossier .im{margin:20px 0 6px;border:1px solid var(--line);border-radius:4px;overflow:hidden;transform:rotate(-1deg);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.dossier .im img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ans{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.ans input{width:100%;min-height:56px;background:rgba(4,6,13,.55);border:1px solid var(--line);border-radius:10px;color:var(--gold2);padding:0 18px;font-family:var(--serif);font-size:1.4rem;letter-spacing:.06em;outline:none;transition:.4s}
.ans input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(243,223,174,.12)}
.hmsg{min-height:1.6em;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--gold2)}
.hint{margin-top:6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint button{color:var(--gold2);text-decoration:underline;text-underline-offset:4px;letter-spacing:.14em;text-transform:uppercase;font-size:.74rem}
.hint button[disabled]{opacity:.4;text-decoration:none;cursor:default}
.hinttx{margin-top:10px;padding:12px 16px;border-left:2px solid var(--gold);background:rgba(217,187,123,.07);font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.45}
.solved-seal{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:10px 0}
.solved-seal .sg{width:120px;height:120px;border-radius:50%;border:2px solid var(--gold2);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:1rem;letter-spacing:.3em;text-transform:uppercase;transform:rotate(-12deg);animation:stamp .9s var(--ease) both;box-shadow:0 0 40px rgba(243,223,174,.25),inset 0 0 0 5px rgba(243,223,174,.08)}
@keyframes stamp{0%{transform:rotate(-30deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-12deg) scale(1)}}
.solved-seal p{font-family:var(--serif);font-style:italic;font-size:1.35rem;line-height:1.4;max-width:26rem}
.susp{min-height:calc(100dvh - 200px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.susp .star{width:90px;height:90px;color:var(--gold2);filter:drop-shadow(0 0 22px #f3dfae)}
@media(prefers-reduced-motion:no-preference){.susp .star{animation:beat 2.6s ease-in-out infinite}}
@keyframes beat{50%{transform:scale(1.18) rotate(18deg);opacity:.7}}
.susp h2{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(3rem,14vw,6rem);line-height:1;color:var(--gold2)}
.susp p{max-width:24rem;color:var(--mut);line-height:1.7}
.susp .btn{opacity:0;pointer-events:none;transform:translateY(14px);transition:.9s var(--ease)}
.susp .btn.show{opacity:1;pointer-events:auto;transform:none}
.finale{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 30px}
.finale .h2{font-size:clamp(2.4rem,10vw,4.6rem)}
.finale p{font-family:var(--serif);font-size:1.35rem;line-height:1.55;max-width:30rem;color:var(--ink)}
.finale .ask{font-family:var(--script);font-size:clamp(2rem,8.4vw,3.2rem);color:var(--gold2);line-height:1.2;margin:10px 0;text-shadow:0 0 30px rgba(243,223,174,.35)}
.finale .look{margin-top:18px;padding:22px 26px;border:1px solid var(--gold);border-radius:4px;background:rgba(217,187,123,.08);font-family:var(--serif);font-style:italic;font-size:clamp(1.7rem,7vw,2.5rem);color:var(--gold2);animation:glowbox 3s ease-in-out infinite;max-width:30rem}
@keyframes glowbox{50%{box-shadow:0 0 50px rgba(243,223,174,.35)}}

/* ---------- fechamento ---------- */
.end{min-height:calc(100dvh - 200px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.end p.m{font-family:var(--serif);font-size:clamp(1.4rem,5.4vw,2rem);line-height:1.5;max-width:30rem}
.end .sig{font-family:var(--script);font-size:clamp(2.6rem,11vw,4.2rem);color:var(--gold2);margin:10px 0 20px;text-shadow:0 0 28px rgba(243,223,174,.3)}

/* ---------- toast e cursor ---------- */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:95;max-width:min(90vw,380px);text-align:center;padding:12px 20px;border-radius:999px;background:rgba(16,27,59,.95);border:1px solid var(--gold);color:var(--gold2);font-size:.82rem;line-height:1.4;opacity:0;pointer-events:none;transition:.5s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cur,#curR{position:fixed;left:0;top:0;z-index:99;pointer-events:none;border-radius:50%;display:none}
#cur{width:6px;height:6px;margin:-3px;background:var(--gold2)}
#curR{width:36px;height:36px;margin:-18px;border:1px solid rgba(243,223,174,.5);transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .35s}
#curR.big{width:64px;height:64px;margin:-32px;background:rgba(243,223,174,.08)}
@media(pointer:fine){body.hascur,body.hascur *{cursor:none!important}body.hascur #cur,body.hascur #curR{display:block}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .reveal{opacity:1;transform:none}
}
</style>

<script>
/* =====================================================================

   Dica: textos aceitam HTML simples (<em>itálico</em>, <br>).

   você pode usar imagens em base64 (data:image/jpeg;base64,...).
   ===================================================================== */
const EU = "Gabriel";   // ← NOME DELE (troque aqui uma vez só: vale para assinaturas e textos)
const CONFIG = {

  // Liga o "modo teste": destrava todas as páginas e ignora a senha. Deixe false no dia!

/* hash simples (cyrb53) — ofuscação leve da senha */
function hashStr(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

function ph(i=0,label='Sua foto aqui'){
  const pal=[['#1b2a55','#7a2438'],['#0f2147','#b08d4f'],['#2a1a3e','#d8b978'],['#10203f','#3d5a99'],['#3a1a2a','#d8b978'],['#0c1a30','#6b4b7d']][i%6];
  let dots='',s=i*97+13;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let k=0;k<28;k++)dots+=`<circle cx="${(r()*800).toFixed(0)}" cy="${(r()*1000).toFixed(0)}" r="${(.8+r()*2.2).toFixed(1)}" fill="#fff" opacity="${(.2+r()*.6).toFixed(2)}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="800" height="1000" fill="url(#g)"/>${dots}<g fill="none" stroke="#f3dfae" stroke-opacity=".5"><circle cx="400" cy="470" r="70"/><circle cx="400" cy="470" r="104" stroke-opacity=".25"/></g><text x="400" y="600" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="40" fill="#f3dfae" fill-opacity=".9">${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

  function burst(x,y,o={}){const n=o.n||46,col=o.colors||GOLD;if(RM)return add({x,y,vx:0,vy:0,life:40,max:40,c:col[0],s:10,g:0,drag:1,t:'c'});
    for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=rnd(.6,1)*(o.speed||4.2);add({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(50,90),max:90,c:col[i%col.length],s:rnd(1.2,2.6),g:.045,drag:.985,t:'c'})}}
  function confetti(n=90){if(RM)return;for(let i=0;i<n;i++)add({x:rnd(0,W),y:rnd(-H*.3,-10),vx:rnd(-1,1),vy:rnd(1.5,4),life:rnd(180,300),max:300,c:GOLD[i%GOLD.length],s:rnd(4,8),g:.02,drag:.995,t:'r',rot:rnd(0,6),vr:rnd(-.2,.2),sw:rnd(0,6)})}
  function add(p){parts.push(p);if(!run){run=true;requestAnimationFrame(loop)}}
  function loop(){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
    parts=parts.filter(p=>p.life>0);
    for(const p of parts){p.life--;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx+(p.sw!==undefined?Math.sin(p.sw+=.08)*.6:0);p.y+=p.vy;
      const a=Math.max(0,Math.min(1,p.life/(p.max*.5)));cx.globalAlpha=a;cx.fillStyle=p.c;
      if(p.t==='c'){cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}
      else{p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.abs(Math.cos(p.rot*1.7))+.15);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore()}}
    cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
    if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,W,H)}}
  let show=null;
  function fireworks(sec=9){if(RM){burst(W/2,H*.4);return}clearInterval(show);confetti(110);let t=0;
    const go=()=>{burst(rnd(W*.15,W*.85),rnd(H*.12,H*.5),{n:rnd(40,70),speed:rnd(3.4,5.4)});if(Math.random()<.4)confetti(30)};
    go();show=setInterval(()=>{go();if(++t>sec*2.2)clearInterval(show)},450)}
  return{burst,confetti,fireworks}
})();

(function(){
  const cv=$('#bg'),cx=cv.getContext('2d');let W,H,S=[],mx=0,my=0;
  function init(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    S=Array.from({length:Math.round(Math.min(150,W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:rnd(.2,1),r:rnd(.3,1.4),p:Math.random()*6,v:rnd(.02,.09)}))}
  init();addEventListener('resize',init);
  addEventListener('pointermove',e=>{mx=(e.clientX/W-.5);my=(e.clientY/H-.5)},{passive:true});
  function draw(t){cx.clearRect(0,0,W,H);
    for(const s of S){s.y-=s.v*s.z;if(s.y<-4){s.y=H+4;s.x=Math.random()*W}
      const a=.25+.55*(.5+.5*Math.sin(t/900*s.z+s.p));const x=s.x-mx*22*s.z,y=s.y-my*22*s.z;
      cx.globalAlpha=a*s.z;cx.fillStyle=s.z>.8?'#f3dfae':'#fff';cx.beginPath();cx.arc(x,y,s.r*s.z+.2,0,6.283);cx.fill()}
    cx.globalAlpha=1;if(!RM&&!document.hidden)requestAnimationFrame(draw)}
  RM?draw(0):requestAnimationFrame(draw);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!RM)requestAnimationFrame(draw)});
})();

let cTimer=null;
function startCounter(p){
  const D=pd(CONFIG.datas.inicioNamoro),start=new Date(D.y,D.m-1,D.d,CONFIG.datas.horaInicioNamoro||0,0,0);
  const nums={};$$('.num',p).forEach(n=>nums[n.dataset.u]=n);
  const upd=()=>{const now=new Date();let a=now,b=start;const future=now<start;if(future){a=start;b=now}
    let y=a.getFullYear()-b.getFullYear(),m=a.getMonth()-b.getMonth(),d=a.getDate()-b.getDate(),h=a.getHours()-b.getHours(),mi=a.getMinutes()-b.getMinutes(),s=a.getSeconds()-b.getSeconds();
    if(s<0){s+=60;mi--}if(mi<0){mi+=60;h--}if(h<0){h+=24;d--}
    if(d<0){d+=new Date(a.getFullYear(),a.getMonth(),0).getDate();m--}if(m<0){m+=12;y--}
    const v={anos:y,meses:m,dias:d,horas:h,minutos:mi,segundos:s};
    for(const k in v){const t=k==='anos'?String(v[k]):pad(v[k]);if(nums[k].textContent!==t){nums[k].textContent=t;if(!RM){nums[k].classList.remove('tick');void nums[k].offsetWidth;nums[k].classList.add('tick')}}}
    const total=Math.floor(Math.abs(now-start)/864e5);
    const mt=y*12+m+1,nx=new Date(D.y,D.m-1+mt,D.d),left=Math.ceil((nx-now)/864e5);
    $('#cnote').innerHTML=future?`<div><b>Falta pouco</b><br>Faltam ${total} dias para o nosso começo.</div>`:`<div><b>${total.toLocaleString('pt-BR')} dias</b><br>desde ${fmtLong(CONFIG.datas.inicioNamoro)}.</div><div><b>${left<=1?'Amanhã':'Em '+left+' dias'}</b><br>é o nosso próximo mesversário.</div>`};
  upd();clearInterval(cTimer);cTimer=setInterval(upd,1000)}
function stopCounter(){clearInterval(cTimer)}

      $('#qfb').textContent=ok?q.acerto:q.erro;if(ok)FX.burst(b.getBoundingClientRect().left+60,b.getBoundingClientRect().top+20,{n:18,speed:2.6});$('#qnx').style.display='inline-flex';$('#qnx').onclick=()=>{this.q++;this.draw()}})}};

/* ---------- CAÇA AO TESOURO ---------- */
const Hunt=(()=>{const C=CONFIG.cacada,n=C.pistas.length;let H={phase:'intro',i:0,hints:{}},viewing=null,solvedFlash=null,tm=null,wrong=0;
  const root=()=>$('#huntRoot');
  const bar=()=>{const cur=H.phase==='clue'?H.i:n;const lab=H.phase==='intro'?'Dossiê fechado':H.phase==='clue'?`Pista ${H.i+1} de ${n}`:'Todas as pistas resolvidas';
    const chips=C.pistas.map((_,k)=>{const s=k<cur,c=H.phase==='clue'&&k===H.i&&viewing===null;return `<button class="hchip ${s?'s':''} ${c?'c':''}" data-chip="${k}" ${(!s&&!(H.phase==='clue'&&k===H.i))?'disabled':''} aria-label="Pista ${k+1}">${s?'✓':k+1}</button>`}).join('');
    return `<div class="hprog"><span class="lab">${lab}</span><div class="hchips">${chips}</div></div>`};
  function clueCard(k,review){const p=C.pistas[k];let ans='';
    if(review)ans=`<div class="hmsg" style="margin-top:20px">Pista já resolvida ✓</div>`;
    else if(p.modo==='palavra')ans=`<form class="ans" id="aForm" autocomplete="off"><input id="aIn" placeholder="Sua resposta" aria-label="Sua resposta" autocapitalize="off" autocomplete="off"><button class="btn gold" type="submit">Decifrar</button><div class="hmsg" id="hm" role="status"></div></form>`;
    else if(p.modo==='escolha')ans=`<div class="ans"><div class="opts">${p.opcoes.map((o,i)=>`<button class="opt" data-o="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div><div class="hmsg" id="hm" role="status"></div></div>`;
    else ans=`<div class="ans"><button class="btn gold" id="aConf">${p.botaoConfirmar||'Encontrei o local'}</button></div>`;
    const hint=(!review&&p.dica)?`<div class="hint" id="hintRow"></div><div id="hintTx"></div>`:'';
    const img=p.imagem?`<div class="im"><img loading="lazy" decoding="async" src="${foto(p.imagem,k+3)}" alt="${p.imagem.placeholder||'Imagem da pista'}"></div>`:'';
    return `<div class="dossier reveal in"><span class="no">${pad(k+1)}</span><div class="tp">${p.tipo}</div><h3>${p.titulo}</h3><div class="tx">${p.texto.map(t=>`<p>${t}</p>`).join('')}</div>${img}${ans}${hint}</div>`}
  function setupHint(k){const p=C.pistas[k],row=$('#hintRow');if(!row)return;clearInterval(tm);let t0=Date.now()-(H.hints['t'+k]||0);
    const tick=()=>{const el=(Date.now()-t0)/1000,left=Math.max(0,Math.ceil((p.dicaApos||0)-el)),ok=H.hints[k]||left<=0||wrong>=2;
      if(H.hints[k]){row.innerHTML='';$('#hintTx').innerHTML=`<div class="hinttx">${p.dica}</div>`;clearInterval(tm);return}
      row.innerHTML=ok?`<button id="hBtn">Preciso de uma dica</button>`:`<button disabled>Dica disponível em ${left}s</button>`;
      const b=$('#hBtn');if(b)b.onclick=()=>{H.hints[k]=1;save();tick()}};
    tick();tm=setInterval(tick,1000)}
  function solve(k){clearInterval(tm);wrong=0;const last=k===n-1;if(last){H.phase='suspense'}else{H.i=k+1}save();solvedFlash=k;FX.burst(innerWidth/2,innerHeight*.45,{n:44});render()}
  const wrongMsg=()=>{wrong++;return C.erros[(wrong-1)%C.erros.length]};
  function render(){const r=root();if(!r)return;clearInterval(tm);let h='';
    if(H.phase==='intro'){h=`<div class="dossier reveal in"><div class="tp">Briefing</div><h3 style="margin-top:8px">Sua missão, se você aceitar</h3><div class="tx">${C.briefing.map(t=>`<p>${t}</p>`).join('')}</div><div class="ans"><button class="btn gold" id="hStart">${C.botaoIniciar}</button></div></div>`;r.innerHTML=bar()+h;$('#hStart').onclick=()=>{H.phase='clue';save();render()};bindChips();return}
    if(solvedFlash!==null){const p=C.pistas[solvedFlash];const last=solvedFlash===n-1;r.innerHTML=bar()+`<div class="dossier"><div class="solved-seal"><div class="sg">Resolvida</div><p>${p.sucesso||'Muito bem!'}</p><button class="btn gold" id="hNext">${last?'Seguir':'Próxima pista'}</button></div></div>`;$('#hNext').onclick=()=>{solvedFlash=null;render()};bindChips();return}
    if(viewing!==null){r.innerHTML=bar()+clueCard(viewing,true)+`<div style="margin-top:18px"><button class="btn sm" id="hBack">Voltar</button></div>`;$('#hBack').onclick=()=>{viewing=null;render()};bindChips();return}
    if(H.phase==='clue'){r.innerHTML=bar()+clueCard(H.i,false);bind(H.i);bindChips();return}
    if(H.phase==='suspense'){r.innerHTML=bar()+`<div class="susp"><svg class="star" viewBox="0 0 48 48" fill="currentColor"><path d="M24 4l4 14 14 6-14 6-4 14-4-14-14-6 14-6z"/></svg><h2>${C.suspenseTitulo}</h2><p>${C.suspenseTexto}</p><button class="btn gold" id="hFound">${C.botaoEncontrei}</button></div>`;
      setTimeout(()=>{const b=$('#hFound');if(b)b.classList.add('show')},RM?0:C.suspenseDelay*1000);$('#hFound').onclick=()=>{H.phase='reveal';save();state.huntDone=true;render();FX.fireworks(10)};bindChips();return}
    if(H.phase==='reveal'){const V=C.revelacao;state.huntDone=true;
      r.innerHTML=bar()+`<div class="finale"><div class="eyebrow">Missão cumprida</div><h2 class="h2">${V.titulo}</h2>${V.paragrafos.map(t=>`<p>${t}</p>`).join('')}<div class="ask">${V.pedido}</div><div class="look">${V.olhe}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px"><button class="btn sm" id="hFw">Mais fogos</button><button class="btn gold" id="hCont">${V.botaoContinuar}</button></div></div>`;
      $('#hFw').onclick=()=>FX.fireworks(6);$('#hCont').onclick=()=>{go(PAGES.findIndex(p=>p.id==='fim'))};bindChips()}}
  function bindChips(){$$('[data-chip]',root()).forEach(b=>b.onclick=()=>{const k=+b.dataset.chip;const cur=H.phase==='clue'?H.i:n;if(k<cur){viewing=k;render()}else{viewing=null;render()}})}
  function bind(k){const p=C.pistas[k];setupHint(k);
    if(p.modo==='palavra'){const f=$('#aForm'),inp=$('#aIn');f.onsubmit=e=>{e.preventDefault();const v=norm(inp.value);if(!v)return;
        if(p.respostas.some(x=>norm(x)===v))solve(k);else{$('#hm').textContent=wrongMsg();inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select();setupHint(k)}};}
    else if(p.modo==='escolha'){$$('[data-o]').forEach(b=>b.onclick=()=>{const i=+b.dataset.o;if(i===p.correta)solve(k);else{b.classList.add('no','shake');$('#hm').textContent=wrongMsg();setupHint(k);setTimeout(()=>b.classList.remove('no','shake'),700)}})}
    else $('#aConf').onclick=()=>solve(k)}
  function save(){if(!LS||!CONFIG.salvarProgresso)return;try{LS.setItem('presente_v1',JSON.stringify({v:[...state.visited],h:H}))}catch(e){}}
  function load(){if(!LS||!CONFIG.salvarProgresso)return;try{if(/[?&]reset/.test(location.search)){LS.removeItem('presente_v1');return}const s=JSON.parse(LS.getItem('presente_v1')||'null');if(s){(s.v||[]).forEach(x=>state.visited.add(x));if(s.h)H=s.h;if(H.phase==='reveal')state.huntDone=true}}catch(e){}}
  return{render,save,load}})();

/* ---------------------- CARTAS: máquina de escrever ---------------------- */
let typing=null;
function openLetter(i){const c=CONFIG.cartas.lista[i],paper=$('#paper');
  paper.innerHTML=`<div class="eyebrow" style="color:#8a2b44">${c.quando}</div><h3 style="margin-top:8px">${c.titulo}</h3><div class="body" id="lbody"></div><div class="sig" id="lsig">${c.assinatura}</div>`;
  $('#lt').classList.add('open');const body=$('#lbody'),full=c.paragrafos;clearInterval(typing);
  const done=()=>{clearInterval(typing);body.classList.remove('caret');body.innerHTML=full.map(p=>`<p>${p}</p>`).join('');$('#lsig').classList.add('show');const rd=$('#rd'+i);if(rd)rd.textContent='Lida ✓'};
  if(RM){done();return}
  let pi=0,ci=0;body.classList.add('caret');body.innerHTML='<p></p>';
  typing=setInterval(()=>{const ps=$$('p',body);const cur=ps[ps.length-1];cur.textContent=full[pi].slice(0,++ci);paper.scrollTop=paper.scrollHeight;
    if(ci>=full[pi].length){pi++;ci=0;if(pi>=full.length){done();return}body.insertAdjacentHTML('beforeend','<p></p>')}},24);
  paper.onclick=()=>{if(typing)done()}}
function closeLetter(){clearInterval(typing);$('#lt').classList.remove('open')}

/* ---------------------- LIGHTBOX ---------------------- */
function lbShow(i){lbIdx=(i+lbItems.length)%lbItems.length;const it=lbItems[lbIdx],img=$('#lbImg');img.style.opacity=0;setTimeout(()=>{img.src=it.src;img.alt=it.cap;img.style.opacity=1},RM?0:180);$('#lbCap').textContent=it.cap;$('#lbSub').textContent=it.sub||''}
function lbOpen(i){lbShow(i);$('#lb').classList.add('open')}
function lbClose(){$('#lb').classList.remove('open')}

/* ---------------------- ROTEIRO / NAVEGAÇÃO ---------------------- */
const appEl=$('#app');
const FIN=()=>PAGES.findIndex(p=>p.finale);
function isLocked(i){if(CONFIG.modoTeste)return false;const p=PAGES[i];
  if(p.finale){for(let k=0;k<i;k++)if(!state.visited.has(k))return true;return false}
  if(p.id==='fim')return !state.huntDone;return false}
function lockMsg(i){const p=PAGES[i];return p.finale?'O finale se abre depois que você passear por todas as páginas ✦':'Primeiro encontre o tesouro ✦'}
function allBeforeFinale(){for(let k=0;k<FIN();k++)if(!state.visited.has(k))return false;return true}

function buildAll(){PAGES.forEach((p,i)=>{const s=document.createElement('section');s.className='page';s.id='pg-'+p.id;s.setAttribute('aria-label',p.nome);s.innerHTML=p.build();appEl.appendChild(s);p.el=s;
  s.addEventListener('scroll',()=>revealCheck(s),{passive:true})});
  const bf=PAGES.findIndex(p=>p.id==='cacada')}

function revealCheck(p){const pr=p.getBoundingClientRect();let k=0;$$('.reveal:not(.in)',p).forEach(e=>{const r=e.getBoundingClientRect();if(r.top<pr.bottom-40&&r.bottom>pr.top){e.style.setProperty('--d',(RM?0:(e.dataset.d||Math.min(k++,6)*.09))+'s');e.classList.add('in')}})}

function go(i){if(i<0||i>=PAGES.length||i===state.idx)return;if(isLocked(i)){toast(lockMsg(i));return}
  const prev=state.idx,dir=i>prev?1:-1,np=PAGES[i];
  if(prev>=0){const pp=PAGES[prev];pp.el.style.setProperty('--enter',(-dir*40)+'px');pp.el.classList.remove('active');pp.leave&&pp.leave(pp.el);
    setTimeout(()=>{if(state.idx!==prev)$$('.reveal.in',pp.el).forEach(e=>e.classList.remove('in'))},900)}
  const el=np.el;el.style.transition='none';el.style.setProperty('--enter',(dir*40)+'px');void el.offsetWidth;el.style.transition='';
  el.scrollTop=0;$$('.reveal.in',el).forEach(e=>e.classList.remove('in'));
  state.idx=i;state.visited.add(i);Hunt.save();
  requestAnimationFrame(()=>{el.classList.add('active');setTimeout(()=>{revealCheck(el);np.enter&&np.enter(el)},RM?0:120)});
  uiUpdate();}

function uiUpdate(){const i=state.idx,p=PAGES[i];
  $('#plabel').textContent=`${pad(i+1)} / ${pad(PAGES.length)} · ${p.nome}`;$('#pfill').style.width=(i/(PAGES.length-1)*100)+'%';
  $('#bottom').classList.toggle('hide',i===0);
  const nx=$('#next'),pv=$('#prev');pv.disabled=i===0;nx.disabled=i===PAGES.length-1;
  nx.classList.toggle('glow',i+1===FIN()&&allBeforeFinale()||(p.finale&&state.huntDone)||false);
  const cover=$('#bottom');$$('#menuList li').forEach((li,k)=>{li.classList.toggle('cur',k===i);li.classList.toggle('lock',isLocked(k));$('.s',li).textContent=isLocked(k)?'Bloqueado':(k===i?'Aqui':(PAGES[k].finale?'Finale':(state.visited.has(k)?'Visto':'')))});
  document.title=`${p.nome} · Para ${N.ela}`}
const next=()=>{const t=state.idx+1;if(t<PAGES.length)go(t)}, prev=()=>go(state.idx-1);

function buildMenu(){$('#menuList').innerHTML=PAGES.map((p,i)=>`<li class="${p.finale?'finale':''}" style="--i:${i}"><button data-m="${i}"><span class="n">${pad(i+1)}</span><span class="t">${p.nome}</span><span class="s"></span></button></li>`).join('')}
const menu=o=>{$('#menu').classList.toggle('open',o);if(o)uiUpdate()};

/* ---------------------- EVENTOS GLOBAIS ---------------------- */
document.addEventListener('click',e=>{const t=e.target;
  const g=t.closest('[data-go]');if(g){next();return}
  const lb=t.closest('[data-lb]');if(lb){lbOpen(+lb.dataset.lb);return}
  const m=t.closest('[data-m]');if(m){menu(false);go(+m.dataset.m);return}
  const fl=t.closest('.fl');if(fl){fl.classList.toggle('flip');fl.setAttribute('aria-pressed',fl.classList.contains('flip'));if(fl.classList.contains('flip')){const r=fl.getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,{n:14,speed:2.4})}return}
  const lt=t.closest('[data-letter]');if(lt){openLetter(+lt.dataset.letter);return}
  const dh=t.closest('.dh');if(dh){const d=dh.parentElement,open=!d.classList.contains('open');
    $$('.dream.open').forEach(x=>{if(x!==d){x.classList.remove('open');$('.dh',x).setAttribute('aria-expanded','false')}});d.classList.toggle('open',open);dh.setAttribute('aria-expanded',open);
    if(open){const r=$('.ico',d).getBoundingClientRect();FX.burst(r.left+r.width/2,r.top+r.height/2,{n:26,speed:3});if(d.classList.contains('done'))FX.burst(r.left+r.width/2,r.top,{n:40,speed:4});if(d.dataset.d&&$('#gl',d)){Globe.start()}else Globe.stop();
      setTimeout(()=>dh.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'}),350)}else Globe.stop();return}
  const tr=t.closest('[data-t]');if(tr){Music.sel(+tr.dataset.t,true);return}
  if(t.closest('#replay')){state.idx===0||go(0);return}
});
$('#next').onclick=next;$('#prev').onclick=prev;$('#menuBtn').onclick=()=>menu(true);$('#menuClose').onclick=()=>menu(false);
$('#lbClose').onclick=lbClose;$('#lbPrev').onclick=()=>lbShow(lbIdx-1);$('#lbNext').onclick=()=>lbShow(lbIdx+1);$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')lbClose()});
$('#ltClose').onclick=closeLetter;$('#lt').addEventListener('click',e=>{if(e.target.id==='lt')closeLetter()});
$('#snd').onclick=()=>{Music.toggle();if(Music.playing)toast('Música ligada ♪');};
document.addEventListener('click',e=>{if(e.target.closest('#tPlay'))Music.toggle();if(e.target.closest('#tPrev'))Music.sel(Music.i-1);if(e.target.closest('#tNext'))Music.sel(Music.i+1);const tp=e.target.closest('#tprog');if(tp){const r=tp.getBoundingClientRect();Music.seek((e.clientX-r.left)/r.width)}});
document.addEventListener('keydown',e=>{
  if(!state.entered)return;if(e.key==='Escape'){menu(false);lbClose();closeLetter();return}
  if(/input|textarea/i.test(document.activeElement.tagName))return;
  if($('#lb').classList.contains('open')){if(e.key==='ArrowRight')lbShow(lbIdx+1);if(e.key==='ArrowLeft')lbShow(lbIdx-1);return}
  if($('#lt').classList.contains('open')||$('#menu').classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')next();if(e.key==='ArrowLeft'||e.key==='PageUp')prev();
  if((e.key==='Enter'||e.key===' ')&&document.activeElement.matches('[data-lb]')){e.preventDefault();lbOpen(+document.activeElement.dataset.lb)}});
/* swipe */
(function(){let sx=0,sy=0,ok=false,t0=0;
  document.addEventListener('touchstart',e=>{const t=e.target;ok=state.entered&&!t.closest('[data-noswipe],input,textarea,#menu,#lb,#lt,canvas,.tprog');const p=e.touches[0];sx=p.clientX;sy=p.clientY;t0=Date.now()},{passive:true});
  document.addEventListener('touchend',e=>{if(!ok)return;const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<700){dx<0?next():prev()}},{passive:true});
  const lb=$('#lb');let lx=0;lb.addEventListener('touchstart',e=>lx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-lx;if(Math.abs(dx)>50)lbShow(lbIdx+(dx<0?1:-1))},{passive:true})})();

/* ---------------------- PORTÃO ---------------------- */
(function(){
  const G=CONFIG.portao,inp=$('#gateInput'),msg=$('#gateMsg');let tries=0;
  $('#gEye').textContent=G.eyebrow;$('#gQ').innerHTML=G.pergunta;$('#gSub').textContent=G.subtitulo;
  // estrelas do portão
  const cv=$('#gateStars'),cx=cv.getContext('2d');let S=[],W,H;const sz=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);S=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.3,1.5),p:Math.random()*6}))};sz();addEventListener('resize',sz);
  let gl=true;(function f(t){if(!gl)return;cx.clearRect(0,0,W,H);for(const s of S){cx.globalAlpha=RM?.6:.2+.7*(.5+.5*Math.sin(t/700+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}RM||requestAnimationFrame(f)})(0);
  // máscara DD/MM/AAAA
  inp.addEventListener('input',e=>{let v=inp.value.replace(/[^\d./-]/g,'');if(!/[./-]/.test(v)&&e.inputType!=='deleteContentBackward'){const d=v.slice(0,8);v=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d}inp.value=v});
  function cands(s){const parts=s.split(/[^\d]+/).filter(Boolean),out=new Set();
    if(parts.length===3){let[d,m,y]=parts;out.add(pad(d)+pad(m)+y)}
    const dg=s.replace(/\D/g,'');out.add(dg);if(dg.length===7){out.add('0'+dg);out.add(dg.slice(0,2)+'0'+dg.slice(2))}return[...out]}
  const check=s=>cands(s).some(c=>hashStr('presente:'+c)===G.hashSenha);
  function open(){gl=false;$('#portal').classList.add('go');FX.burst(innerWidth/2,innerHeight/2,{n:70,speed:6});
    setTimeout(()=>{$('#gate').classList.add('open')},RM?0:500);
    setTimeout(()=>{$('#gate').style.display='none';startApp()},RM?50:1900)}
  $('#gateForm').addEventListener('submit',e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return}
    if(CONFIG.modoTeste||check(v)){msg.textContent=G.sucesso;inp.blur();open();return}
    tries++;msg.textContent=(G.dicas[tries]?G.dicas[tries]+' ':'')+G.erros[(tries-1)%G.erros.length];
    inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');inp.select()});
  setTimeout(()=>{try{if(!/iPhone|iPad|Android/i.test(navigator.userAgent))inp.focus()}catch(e){}},400);
  if(CONFIG.modoTeste){msg.textContent='(modo teste ativo — toque em Abrir)'}
})();

function startApp(){state.entered=true;$('#brand').textContent=`${N.ela[0]} ✦ ${N.eu[0]}`;
  $('#app').classList.add('on');$('#topbar').classList.add('on');$('#bottom').classList.add('on');go(0);Music.ui()}

/* ---------------------- INICIALIZAÇÃO ---------------------- */
Hunt.load();buildAll();buildMenu();Music.ui();
</script>
